name: Run FIT from Java performer Gerrit ref

on:
  workflow_dispatch:
    inputs:
      gerritRef:
        description: Gerrit ref to build for couchbase/couchbase-jvm-clients
        type: string
        default: refs/changes/67/246067/3
      clusterVersion:
        description: Couchbase Server version for the preset definition
        type: string
        default: 7.6.5

permissions:
  actions: write
  contents: read
  id-token: write
  checks: write

jobs:
  generate-definition:
    runs-on: ubuntu-latest
    outputs:
      definition-base64: ${{ steps.definition.outputs.definition_base64 }}
      performer-image-name: ${{ steps.performer.outputs.performer_image_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Build Java performer workflow
        env:
          GH_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
        run: |
          run_url="$(
            gh workflow run \
              --repo couchbase/couchbase-jvm-clients \
              build-fit-performer.yml \
              --field "ref=${{ inputs.gerritRef }}"
          )"
          run_id="${run_url##*/}"
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            for attempt in 1 2 3 4 5; do
              run_id="$(
                gh run list \
                  --repo couchbase/couchbase-jvm-clients \
                  --workflow build-fit-performer.yml \
                  --event workflow_dispatch \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId'
              )"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                break
              fi
              sleep 5
            done
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Failed to determine triggered build-fit-performer workflow run id." >&2
            exit 1
          fi
          gh run watch "$run_id" --repo couchbase/couchbase-jvm-clients --exit-status

      - name: Compute performer image name
        id: performer
        run: |
          sanitized_ref="$(printf '%s' '${{ inputs.gerritRef }}' | tr '/:' '-')"
          echo "performer_image_name=java-fit-performer:${sanitized_ref}" >> "$GITHUB_OUTPUT"

      - name: Generate preset definition
        run: >
          bun run definition -- generate-preset
          --type preset-functional-tests
          --cluster-version "${{ inputs.clusterVersion }}"
          --performer-image-name "${{ steps.performer.outputs.performer_image_name }}"
          --output .github/generated/fit-java-performer-gerrit.yaml

      - name: Encode definition for reusable workflow
        id: definition
        run: |
          {
            echo "definition_base64<<EOF"
            base64 -w 0 .github/generated/fit-java-performer-gerrit.yaml
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload generated definition
        uses: actions/upload-artifact@v4
        with:
          name: fit-definition-${{ github.run_id }}
          path: .github/generated/fit-java-performer-gerrit.yaml
          if-no-files-found: error

  run-fit:
    needs: generate-definition
    uses: ./.github/workflows/fit-cli.yaml
    with:
      definitionBase64: ${{ needs.generate-definition.outputs.definition-base64 }}
    secrets: inherit
