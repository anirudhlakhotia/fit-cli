name: Build binaries

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artifact containing the linux-x64 binary
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: write   # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64   src/fit/main/main.ts --outfile dist/fit-linux-x64
          bun build --compile --target=bun-linux-arm64  src/fit/main/main.ts --outfile dist/fit-linux-arm64
          bun build --compile --target=bun-darwin-x64  src/fit/main/main.ts --outfile dist/fit-darwin-x64
          bun build --compile --target=bun-darwin-arm64 src/fit/main/main.ts --outfile dist/fit-darwin-arm64

      - name: Upload artifact (for workflow_call consumers)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fit-binaries-${{ github.sha }}
          path: dist/fit-*
          retention-days: 7

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            dist/fit-linux-x64 \
            dist/fit-linux-arm64 \
            dist/fit-darwin-x64 \
            dist/fit-darwin-arm64
        env:
          GH_TOKEN: ${{ github.token }}
