#          aws configure set region "$AWS_DEFAULT_REGION"
#          # Debugging
#          echo "Key prefix: ${AWS_ACCESS_KEY_ID:0:4}"
#          aws sts get-caller-identity

      - name: Diagnostics
        run: |
          echo "Key prefix: ${AWS_ACCESS_KEY_ID:0:4}"
          aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Clone and setup fit-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          AWS_REGION: us-west-2
        run: |
          git clone https://github.com/couchbaselabs/fit-cli.git
          cd fit-cli
          npm ci
          npm run config -- init --auto

      - name: Run fit-cli
        env:
          AWS_REGION: us-west-2
          AWS_DEFAULT_REGION: us-west-2
        run: |
          cd fit-cli
          npm run definition -- execute ${{ inputs.definitionFile }}

