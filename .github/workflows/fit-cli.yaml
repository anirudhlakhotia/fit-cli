# Test locally
# ------------
# (though it doesn't really work as it a) requires AWS CLI be installed and though that's fixable, then b) gh-act doesn't provide real AWS creds):
# gh extension install nektos/gh-act
# gh act workflow_dispatch -W .github/workflows/run-fit-cli-functional.yml --input definitionFile="examples/fit-functional-sanity-test.json5"
#
# Run
# ------------
# gh workflow run run-fit-functional.yml --ref <your-branch> Z--field definitionFile="examples/fit-functional-sanity-test.json5"
name: Run FIT with fit-cli

on:
  workflow_dispatch:
    inputs:
      definitionFile:
        description: A fit-cli definition file e.g. "https://gist.github.com/programmatix/<gist>" or "examples/fit-functional-sanity-test.json5" (local to fit-cli).  To generate one, clone the fit-cli project and follow the README.
        type: string
        default: examples/fit-functional-sanity-test.json5

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read
  checks: write     # required for action-junit-report to post the JUnit check run / annotations

jobs:
  run-fit-cli:
    runs-on: [ubuntu-latest]
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-${{ github.actor }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Diagnostics
        run: |
          echo "Key prefix: ${AWS_ACCESS_KEY_ID:0:4}"
          echo "Github actor: ${{ github.actor }}"
          echo "Github run_id: ${{ github.run_id }}"
          aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Clone and setup fit-cli
        env:
          # secrets.GITHUB_TOKEN contains a short-lived token bound to this repo, so we can't use it for e.g. checking out transactions-fit-performer
          # Instead we use a hardcoded github PAT (the author's).  Migrating to a Github App in future would be better.
          GITHUB_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
          GITHUB_USER: ${{ secrets.FIT_CLI_GITHUB_USER }}
        run: |
          git clone --branch ${{ github.ref_name }} https://github.com/couchbaselabs/fit-cli.git
          cd fit-cli
          npm ci
          npm run config -- edit --auto

      - name: Run fit-cli
        env:
          GITHUB_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
          GITHUB_USER: ${{ secrets.FIT_CLI_GITHUB_USER }}
        run: |
          cd fit-cli
          npm run definition -- execute ${{ inputs.definitionFile }} | tee /tmp/fit-cli-output.log
          echo "last_line=$(tail -1 /tmp/fit-cli-output.log)" >> $GITHUB_OUTPUT
        id: run-fit-cli

      # The FIT test-driver writes surefire JUnit XML, which fit-cli collects into
      # each run's artifact dir (see collect-junit.ts). A run can produce many of
      # these across instances/clusters/sessions, so we match them with a glob.
      # if: always() — we still want the report when the test run step failed.
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '/tmp/fit-cli/**/surefire-reports/TEST-*.xml'
          check_name: FIT functional tests
          require_tests: false   # a definition may legitimately run no functional tests

      - name: Job summary
        if: always()
        run: |
          echo "## fit-cli Run Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.run-fit-cli.outputs.last_line }}" ]; then
            echo "**Result:** ${{ steps.run-fit-cli.outputs.last_line }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Artifacts are attached to [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) as \`fit-cli-run-${{ github.run_id }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find /tmp/fit-cli -type f 2>/dev/null | sort >> $GITHUB_STEP_SUMMARY || echo "(none)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fit-cli-run-${{ github.run_id }}
          path: /tmp/fit-cli/
          if-no-files-found: warn
