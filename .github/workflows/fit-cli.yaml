# Test locally
# ------------
# (though it doesn't really work as it a) requires AWS CLI be installed and though that's fixable, then b) gh-act doesn't provide real AWS creds):
# gh extension install nektos/gh-act
# gh act workflow_dispatch -W .github/workflows/run-fit-cli-functional.yml --input definitionFile="examples/fit-functional-sanity-test.json5"
#
# Run
# ------------
# gh workflow run fit-cli.yaml --ref <your-branch> --field definitionFile="https://gist.githubusercontent.com/programmatix/<gist-id>/raw" --repo couchbaselabs/fit-cli
# Note: use gist.githubusercontent.com/…/raw (not gist.github.com) to get raw content, not the HTML page.
name: Run FIT with fit-cli

on:
  workflow_dispatch:
    inputs:
      definitionFile:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli). Use gist.githubusercontent.com/…/raw, not gist.github.com. To generate one, clone the fit-cli project and follow the README.
        type: string
        default: examples/fit-functional-sanity-test.json5
      capellaEnvironment:
        description: Used for FIT/SIT testing against Capella
        type: choice
        default: capella-env-dev
        options:
          - capella-env-dev
#          - capella-env-stage
  # Allow other repos to call this workflow with `uses: couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml@main`.
  # Inputs mirror workflow_dispatch above; note workflow_call does not support `type: choice`, so capellaEnvironment is a string here.
  workflow_call:
    inputs:
      definitionFile:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli). Use gist.githubusercontent.com/…/raw, not gist.github.com. To generate one, clone the fit-cli project and follow the README.
        type: string
        default: examples/fit-functional-sanity-test.json5
      capellaEnvironment:
        description: Used for FIT/SIT testing against Capella (one of the configured Capella environments, e.g. capella-env-dev)
        type: string
        default: capella-env-dev

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read
  checks: write     # required for action-junit-report to post the JUnit check run / annotations
  actions: write    # required to update the workflow run display_title

jobs:
  run-fit-cli:
    runs-on: [ubuntu-latest]
    # Bind to the chosen Capella environment so its CAP_* variables resolve below.
    environment: ${{ inputs.capellaEnvironment }}
    steps:
      # Obtain a GitHub token that has permissions to check out private repos (transactions-fit-performer)
      # (The {{ secrets.GITHUB_TOKEN }} that GHA automatically provides is valid only for the current repo.)
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CBFITFRAMEWORK_APP_ID }}
          private-key: ${{ secrets.CBFITFRAMEWORK_PRIVATE_KEY }}
          owner: couchbaselabs

      # Use OIDC to assume an AWS role fit-cli-role that has all the permissions needed to create instances etc.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-${{ github.actor }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3
          role-duration-seconds: 43200

      - name: Diagnostics
        run: |
          echo "Key prefix: ${AWS_ACCESS_KEY_ID:0:4}"
          echo "Github actor: ${{ github.actor }}"
          echo "Github run_id: ${{ github.run_id }}"
          aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Clone and setup fit-cli
        env:
          # Not working yet
#          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
#          GITHUB_USER: x-access-token
          # secrets.GITHUB_TOKEN contains a short-lived token bound to this repo, so we can't use it for e.g. checking out transactions-fit-performer
          # Instead we use a hardcoded github PAT (the author's).  Migrating to a Github App in future would be better.
          GITHUB_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
          GITHUB_USER: ${{ secrets.FIT_CLI_GITHUB_USER }}
          # Capella settings from the chosen environment, which will end up in ~/.fit-cli/config.json5
          CAPELLA_USER: ${{ vars.CAP_USER }}
          CAPELLA_ENDPOINT: ${{ vars.CAP_END_POINT }}
          CAPELLA_OID: ${{ vars.CAP_OID }}
          CAPELLA_PASS: ${{ vars.CAP_PASS }}
          CAPELLA_OVERRIDE_TOKEN: ${{ vars.CAP_OVERRIDE_TOKEN }}
          CAPELLA_INTERNAL_SUPPORT_TOKEN: ${{ vars.CAP_INTERNAL_SUPPORT_TOKEN }}
        run: |
          git clone --branch ${{ github.ref_name }} https://github.com/couchbaselabs/fit-cli.git
          cd fit-cli
          npm ci
          npm run config -- edit --auto

      - name: Run fit-cli
        env:
#          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
#          GITHUB_USER: x-access-token
          GITHUB_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
          GITHUB_USER: ${{ secrets.FIT_CLI_GITHUB_USER }}
        run: |
          set -o pipefail
          cd fit-cli
          npm run definition -- execute ${{ inputs.definitionFile }} | tee /tmp/fit-cli-output.log
        id: run-fit-cli

      # https://github.com/marketplace/actions/junit-report-action
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '/tmp/fit-cli/**/surefire-reports/TEST-*.xml'
          check_name: FIT functional tests
          require_tests: false   # a definition may legitimately run no functional tests
          detailed_summary: true
          # Unfortunately this is required as otherwise we blow a 1024k $GITHUB_STEP_SUMMARY limit. The full JUnit output is in the artifacts (and S3).
          # todo - not sure if true, trying includinbg passed results for now
          include_passed: true
          comment: true
          group_suite: true
          include_time_in_summary: true
          include_empty_in_summary: true
          annotations_limit: 100 # More than this probably isn't useful anyway

      - name: Job summary
        if: always()
        run: .github/scripts/job-summary.sh "${{ steps.run-fit-cli.outcome }}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fit-cli-run-${{ github.run_id }}
          path: /tmp/fit-cli/
          if-no-files-found: warn
