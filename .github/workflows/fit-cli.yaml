name: Run FIT with fit-cli (supports FIT/SIT, FIT/PERF and FIT functional)

on:
  workflow_dispatch:
    inputs:
      definitionFile:
        description: A fit-cli definition file e.g. "https://gist.github.com/programmatix/<gist>" or "examples/fit-functional-sanity-test.json5" (local to fit-cli).  To generate one, clone the fit-cli project and follow the README.
        type: string
        default: examples/fit-functional-sanity-test.json5

jobs:
  run-fit-cli:
    runs-on: [ubuntu-latest]
    steps:
#      - name: Install and configure AWS CLI
