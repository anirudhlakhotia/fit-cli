name: Run FIT with fit-cli

on:
  workflow_dispatch:
    inputs:
      definitionFile:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli). To generate one, clone the fit-cli project and follow the README.
        type: string
        default: examples/fit-functional-sanity-test.json5
      definitionBase64:
        description: Optional base64-encoded definition contents. When set, this takes precedence over definitionFile.
        type: string
        default: ""
      fitCliSource:
        description: '"stable" (default) or "latest" to use a released fit-cli binary (for stable testing); "source" to clone the current branch and run via bun (for development).'
        type: string
        default: stable
      cbcollect:
        description: Collect cluster diagnostics (cbcollect)
        type: boolean
        default: false
  workflow_call:
    inputs:
      definitionFile:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli). To generate one, clone the fit-cli project and follow the README.
        type: string
        default: examples/fit-functional-sanity-test.json5
      definitionBase64:
        description: Internal workflow-call transport for an inline base64-encoded definition. When set, this takes precedence over definitionFile.
        type: string
        default: ""
      fitCliSource:
        description: '"stable" (default) or "latest" to use a released fit-cli binary (for stable testing); "source" to clone the current branch and run via bun (for development).'
        type: string
        default: stable
      cbcollect:
        description: Collect cluster diagnostics (cbcollect)
        type: boolean
        default: false

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read
  checks: write     # required for action-junit-report to post the JUnit check run / annotations
  actions: write    # required to update the workflow run display_title

jobs:
  run-fit-cli:
    runs-on: [ubuntu-latest]
    steps:
      # Obtain a GitHub token that has permissions to check out private repos (transactions-fit-performer)
      # (The {{ secrets.GITHUB_TOKEN }} that GHA automatically provides is valid only for the current repo.)
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CBFITFRAMEWORK_APP_ID }}
          private-key: ${{ secrets.CBFITFRAMEWORK_PRIVATE_KEY }}
          owner: couchbaselabs

      # Use OIDC to assume an AWS role fit-cli-role that has all the permissions needed to create instances, get secrets etc.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-${{ github.actor }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3
          role-duration-seconds: 43200

      - name: OIDC failure hints
        if: failure()
        run: |
          echo "::error::AWS OIDC authentication failed. Troubleshooting steps:"
          echo "::error::1. Check the trust policy on the fit-cli-role (arn:aws:iam::958525475024:role/fit-cli-role) in the AWS console."
          echo "::error::   The trust policy must allow sts:AssumeRoleWithWebIdentity for this GitHub repo/org."
          echo "::error::   Expected subject condition: token.actions.githubusercontent.com:sub matches repo:couchbaselabs/fit-cli:* (or similar)"
          echo "::error::2. Verify the workflow has 'id-token: write' permissions (it should — check if a calling workflow overrides permissions)."
          echo "::error::3. If this workflow is called from another repo, the OIDC subject will be that repo — its sub must also be in the trust policy."
          echo "::error::Caller identity: repo=${{ github.repository }}, ref=${{ github.ref }}, actor=${{ github.actor }}"

      - name: Diagnostics
        run: |
          echo "Key prefix: ${AWS_ACCESS_KEY_ID:0:4}"
          echo "Github actor: ${{ github.actor }}"
          echo "Github run_id: ${{ github.run_id }}"
          echo "definitionFile: ${{ inputs.definitionFile }}"
          echo "definitionBase64 provided: ${{ inputs.definitionBase64 != '' }}"
          echo "fitCliSource: ${{ inputs.fitCliSource }}"
          aws sts get-caller-identity

      - uses: oven-sh/setup-bun@v2
        if: inputs.fitCliSource == 'source'
        with:
          bun-version: latest

      - name: Setup fit-cli
        env:
          # secrets.GITHUB_TOKEN is bound to this repo only; we use a PAT instead.
          GITHUB_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
          GITHUB_USER: ${{ secrets.FIT_CLI_GITHUB_USER }}
        run: |
          if [[ "${{ inputs.fitCliSource }}" == "source" ]]; then
            git clone --branch ${{ github.ref_name }} https://github.com/couchbaselabs/fit-cli.git
            cd fit-cli && bun install --frozen-lockfile && bun run config edit --auto --suppress-artifacts
          else
            CHANNEL=${{ inputs.fitCliSource }} curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | bash
            fit config edit --auto --suppress-artifacts
          fi

      - name: Materialize inline definition
        if: ${{ inputs.definitionBase64 != '' }}
        run: |
          if [[ "${{ inputs.fitCliSource }}" == "source" ]]; then
            printf '%s' '${{ inputs.definitionBase64 }}' | base64 --decode > fit-cli/.github/generated-definition.yaml
            echo "FIT_DEFINITION_FILE=.github/generated-definition.yaml" >> "$GITHUB_ENV"
          else
            printf '%s' '${{ inputs.definitionBase64 }}' | base64 --decode > "${{ runner.temp }}/generated-definition.yaml"
            echo "FIT_DEFINITION_FILE=${{ runner.temp }}/generated-definition.yaml" >> "$GITHUB_ENV"
          fi

      - name: Select definition path
        if: ${{ inputs.definitionBase64 == '' }}
        run: echo "FIT_DEFINITION_FILE=${{ inputs.definitionFile }}" >> "$GITHUB_ENV"

      - name: Run fit-cli
        env:
          # todo don't think we need these anymore?
#          GITHUB_TOKEN: ${{ secrets.FIT_CLI_GITHUB_PAT }}
#          GITHUB_USER: ${{ secrets.FIT_CLI_GITHUB_USER }}
          # The PAT above can't update GHA run titles; PATCH /actions/runs/{id} only works with the built-in run-scoped token.
          GHA_RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [[ "${{ inputs.fitCliSource }}" == "source" ]]; then
            cd fit-cli && bun run definition execute "${FIT_DEFINITION_FILE}" ${{ inputs.cbcollect && '--cbcollect' || '' }} | tee /tmp/fit-cli-output.log
          else
            fit definition execute "${FIT_DEFINITION_FILE}" ${{ inputs.cbcollect && '--cbcollect' || '' }} | tee /tmp/fit-cli-output.log
          fi
        id: run-fit-cli

      # https://github.com/marketplace/actions/junit-report-action
      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '/tmp/fit-cli/**/surefire-reports/TEST-*.xml'
          check_name: FIT functional tests
          # Nb all the comments below will be tidied away once finalised the params
          require_tests: false   # a definition may legitimately run no functional tests
          detailed_summary: true
          # Unfortunately this is required as otherwise we blow a 1024k $GITHUB_STEP_SUMMARY limit. The full JUnit output is in the artifacts (and S3).
          # todo - not sure if true, trying includinbg passed results for now
          include_passed: true
#          comment: true # This requires a PR to attach to, not what we want
          group_suite: true
          include_time_in_summary: true
          include_empty_in_summary: true
          # This is just bugged and limits the tests themselves to 100
          # annotations_limit: 100 # More than this probably isn't useful anyway


      - name: Publish test results
        if: always()
        run: |
          curl -s https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output ${{ runner.temp }}/JunitMarkdown.java
          java ${{ runner.temp }}/JunitMarkdown.java . >> $GITHUB_STEP_SUMMARY

      - name: Job summary
        if: always() && inputs.fitCliSource == 'source'
        run: fit-cli/.github/scripts/job-summary.sh "${{ steps.run-fit-cli.outcome }}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fit-cli-run-${{ github.run_id }}
          path: /tmp/fit-cli/
          if-no-files-found: warn
