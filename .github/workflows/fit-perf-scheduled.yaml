# Scheduled FIT/PERF (SDK performance testing) run.
# ---------------------------------------------------
# Manual run (e.g. with --dry-run so nothing is written to the prod DB):
#   gh workflow run fit-perf-scheduled.yaml --field dryRun=true --repo couchbaselabs/fit-cli
name: Scheduled FIT/PERF

on:
  # Cron trigger disabled for now: jenkins-sdk's GHCR-only version-discovery change
  # (prebuilt-container-rollout) hasn't been released there yet. Trigger manually via
  # workflow_dispatch (with --jenkins-sdk-branch prebuilt-container-rollout) until then.
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Force variables.dryRun=true (exercises the whole pipeline without writing results).
        type: boolean
        default: false
      jenkinsSdkBranch:
        description: Clone this branch of jenkins-sdk instead of its default branch (e.g. prebuilt-container-rollout).
        type: string
        default: ""

# Don't run multiple of this job concurrently.  Github will queue up just one item.
concurrency:
  group: fit-perf-scheduled
  cancel-in-progress: false

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

jobs:
  fit-perf-scheduled:
    runs-on: [ubuntu-latest]
    # Below GitHub's 360-minute hard cap, leaving buffer for setup/teardown steps.
    timeout-minutes: 350
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Use OIDC to assume fit-cli-role.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-fit-perf-scheduled-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Run FIT/PERF
        env:
          DRY_RUN: ${{ inputs.dryRun || false }}
          JENKINS_SDK_BRANCH: ${{ inputs.jenkinsSdkBranch || '' }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$JENKINS_SDK_BRANCH" ]; then
            ARGS+=(--jenkins-sdk-branch "$JENKINS_SDK_BRANCH")
          fi
          echo "Running: bun src/fit-perf-scheduled/fit-perf-scheduled.ts ${ARGS[*]}"
          bun src/fit-perf-scheduled/fit-perf-scheduled.ts "${ARGS[@]}"

      # Backstop for when the job is cancelled/times out (e.g. hit timeout-minutes above) —
      # the script's own process gets killed outright then, so its normal on-failure
      # termination (see --keep-on-failure in fit-perf-scheduled.ts) never gets to run.
      - name: Terminate instance if cancelled
        if: always() && cancelled()
        run: |
          if [ -f fit-perf-scheduled-instance.json ]; then
            id=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('fit-perf-scheduled-instance.json','utf8')).instanceId)")
            echo "Job was cancelled — terminating instance $id"
            bun run cloud-instances remove "$id" --force
          else
            echo "No fit-perf-scheduled-instance.json found; nothing to terminate."
          fi
