name: Run FIT preset definition

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Preset definition template to use
        type: choice
        options:
          - functional
          - functional-quick-sanity
          - situational-quick-sanity
          - qe-set
          - everything-quick-sanity
          - cng-functional
          - cng-functional-quick-sanity
        default: functional
      performerImageName:
        description: Performer Docker image name including tag (e.g. java-fit-performer:main, ghcr.io/couchbaselabs/java-fit-performer:1.2.3)
        type: string
        required: true
      cbcollect:
        description: Collect cluster diagnostics (cbcollect)
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  id-token: write
  checks: write

jobs:
  generate-definition:
    runs-on: ubuntu-latest
    outputs:
      definition-base64: ${{ steps.definition.outputs.definition_base64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Generate preset definition
        run: >
          bun src/fit/preset/preset.ts generate
          "${{ inputs.preset }}"
          --performer-image-name "${{ inputs.performerImageName }}"
          --output .github/generated/preset-definition.yaml

      - name: Encode generated definition
        id: definition
        run: |
          {
            echo "definition_base64<<EOF"
            base64 -w 0 .github/generated/preset-definition.yaml
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload generated definition
        uses: actions/upload-artifact@v4
        with:
          name: fit-definition-${{ github.run_id }}
          path: .github/generated/preset-definition.yaml
          if-no-files-found: error

  run-fit:
    needs: generate-definition
    uses: ./.github/workflows/fit-cli.yaml
    with:
      definitionBase64: ${{ needs.generate-definition.outputs.definition-base64 }}
      cbcollect: ${{ inputs.cbcollect }}
    secrets: inherit
