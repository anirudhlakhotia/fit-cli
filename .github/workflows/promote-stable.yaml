name: Promote to stable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64   src/fit/main/main.ts --outfile dist/fit-linux-x64
          bun build --compile --target=bun-linux-arm64  src/fit/main/main.ts --outfile dist/fit-linux-arm64
          bun build --compile --target=bun-darwin-x64  src/fit/main/main.ts --outfile dist/fit-darwin-x64
          bun build --compile --target=bun-darwin-arm64 src/fit/main/main.ts --outfile dist/fit-darwin-arm64

      - name: Update stable release
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | bash
          ```

          > **After installing, run `fit config edit` to configure your credentials before first use.**

          See the [README](https://github.com/couchbaselabs/fit-cli#getting-started) for full usage instructions.
          EOF

          gh release delete stable --yes --cleanup-tag 2>/dev/null || true
          gh release create stable \
            --title "Stable" \
            --notes-file /tmp/release-notes.md \
            dist/fit-linux-x64 \
            dist/fit-linux-arm64 \
            dist/fit-darwin-x64 \
            dist/fit-darwin-arm64
        env:
          GH_TOKEN: ${{ github.token }}
