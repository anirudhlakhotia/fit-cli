version: 1
type: fit
# Test checking out from gerrit
setup:
  repos:
    transactions-fit-performer:
      gerritRef: refs/changes/30/246430/2
cycles:
  - type: situational
    execution:
      instance:
        aws: {}
    iterations:
      - setup:
          performer:
            sdk: kotlin
            onPortInUse: restart
        situational:
          database:
            mode: hosted
        runtime:
          tests:
            - com.couchbase.situational.tests.SanityTest
    cbdinocluster:
      init:
        # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
        config:
          version: 6
          docker:
            enabled: true
            network: fit
            host: unix:///var/run/docker.sock
          default-deployer: docker
      # Note config: is not provided here as FIT/SIT creates its own clusters