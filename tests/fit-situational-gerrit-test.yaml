version: 1
type: fit
# Test checking out from gerrit
setup:
  repos:
    transactions-fit-performer:
      gerritRef: refs/changes/30/246430/2
instances:
  - aws: {}
    clusters: []
    cbdinocluster:
      init:
        # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
        config:
          version: 6
          docker:
            enabled: true
            network: fit
            host: unix:///var/run/docker.sock
          default-deployer: docker
    clusterlessSessions:
      - performer:
          sdk: kotlin
          onPortInUse: restart
        runs:
          - type: situational
            situational:
              database:
                mode: hosted
            tests:
              run:
                - com.couchbase.situational.tests.SanityTest
