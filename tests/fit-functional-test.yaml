# This is intended to be run manually and test a little bit of everything in FIT functional.
version: 1
type: fit
cycles:
  - type: functional
    cluster:
      cbdinocluster:
        init:
          # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
          config:
            version: 6
            docker:
              enabled: true
              network: fit
              host: unix:///var/run/docker.sock
            default-deployer: docker
        config:
          nodes:
            - count: 1
              version: 8.1.0-2188
              services:
                - kv
                - n1ql
                - index
        onClusterExists: useExisting
    iterations:
      - setup:
          performer:
            # Test a prebuilt container
            sdk: java
            onPortInUse: reuse
        runtime:
          tests:
            - com.couchbase.client.kv.SanityTest

  # Test multiple cycles
  - type: functional
    cluster:
      cbdinocluster:
        init:
          # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
          config:
            version: 6
            docker:
              enabled: true
              network: fit
              host: unix:///var/run/docker.sock
            default-deployer: docker
        config:
          nodes:
            - count: 1
              version: 8.1.0-2188
              services:
                - kv
                - n1ql
                - index
        onClusterExists: useExisting
    iterations:
      - setup:
          performer:
            # Test building on demand
            sdk: cpp
            onPortInUse: reuse
        runtime:
          tests:
            - com.couchbase.client.kv.SanityTest
