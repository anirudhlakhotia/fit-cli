# This is intended to be run manually and test a little bit of everything in FIT functional.
version: 1
type: fit
instances:
  - aws: {}
    clusters:
      - cbdinocluster:
          init:
            # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
            config:
              version: 6
              docker:
                enabled: true
                network: fit
                host: unix:///var/run/docker.sock
          config:
            nodes:
              - count: 1
                version: 8.1.0-2188
                services:
                  - kv
                  - n1ql
                  - index
          onClusterExists: useExisting
        sessions:
          - performer:
              # Test a prebuilt container
              sdk: java
              onPortInUse: reuse
            runs:
              - type: functional
                tests:
                  run:
                    - com.couchbase.client.kv.SanityTest

  - aws: {}
    clusters:
      - cbdinocluster:
          init:
            # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
            config:
              version: 6
              docker:
                enabled: true
                network: fit
                host: unix:///var/run/docker.sock
          config:
            nodes:
              - count: 1
                version: 8.1.0-2188
                services:
                  - kv
                  - n1ql
                  - index
          onClusterExists: useExisting
        sessions:
          - performer:
              # Test building on demand
              sdk: cpp
              onPortInUse: reuse
            runs:
              - type: functional
                tests:
                  run:
                    - com.couchbase.client.kv.SanityTest
