# Runs a single sanity FIT/SIT test against a single SDK, in a clean environment.
# Run with:
# npm run definition -- --interactive examples/fit-situational-sanity-test.yaml
version: 1
type: fit
cycles:
  - type: situational
    iterations:
      - setup:
          performer:
            sdk: kotlin
            onPortInUse: restart
        situational:
          database:
            mode: hosted
        runtime:
          tests:
            - com.couchbase.situational.tests.VolumeTest#steadyStateKvGets
    cbdinocluster:
      init:
        # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
        config:
          version: 6
          docker:
            enabled: true
            network: fit
            host: unix:///var/run/docker.sock
          default-deployer: docker
      # Note config: is not provided here as FIT/SIT creates its own clusters