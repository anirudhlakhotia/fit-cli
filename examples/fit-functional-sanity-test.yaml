# Runs a single SanityTest test file against a single SDK, in a clean environment.
# Run with:
# npm run definition -- --interactive examples/fit-functional-sanity-test.yaml
version: 1
type: fit
instances:
  - aws: {}
    clusters:
      - cbdinocluster:
          init:
            # This file will be uploaded verbatim into clean environments as ~/.cbdinocluster
            config:
              version: 6
              docker:
                enabled: true
                network: fit
                host: unix:///var/run/docker.sock
              default-deployer: docker
          config:
            nodes:
              - count: 3
                version: 8.1.0-2188
                services:
                  - kv
                  - n1ql
                  - index
                  - fts
          onClusterExists: useExisting
        # This will be used as a base when generating FITConfiguration.json.  Anything here will be copied into the config (unless overwritten by fit-cli).
        fitConfig:
          clusterAccess:
            connectionString: couchbase://${defaultHostname}
            username: Administrator
            password: password
            tls: null
            rest:
              hostname: ${defaultHostname}
              resolveDnsSrv: false
            proxy:
              hostname: host.docker.internal
          excludeTests:
            - situational
        sessions:
          - performer:
              sdk: java
              onPortInUse: reuse
            runs:
              - type: functional
                tests:
                  run:
                    - com.couchbase.client.kv.SanityTest
