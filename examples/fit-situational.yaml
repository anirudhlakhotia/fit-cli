# Example FIT situational (FIT/SIT) definition file.
#
# Situational testing checks how an SDK copes with cluster rebalances and
# upgrades under sustained load. Unlike functional testing, the FIT test-driver
# builds and manages its own cluster via cbdino and streams timeseries results to
# a database — so there is no shared `setup.cluster` here. Each situational
# iteration carries its own cbdino + database settings under `situational`.
#
# Run it (locally — situational uses cbdino's Docker network):
#
#   npm run definition examples/fit-situational.yaml
#
# Validate a file without running it:
#   npx tsx src/workflows/fit-shared/definition/parse-definition.ts examples/fit-situational.yaml

version: 1
type: fit

# No shared `setup:` block — situational iterations don't use a shared cluster.

iterations:
  - type: situational
    # Which performer to build and run, exactly as for a functional iteration.
    setup:
      performer:
        # One of: java, scala, kotlin, cpp, dotnet, go, node, python, ruby, rust.
        sdk: java
        # Port the performer listens on (default 8060).
        # port: 8060
        # What to do if the performer port is already in use: fail | restart | reuse.
        # onPortInUse: restart

    # Situational-specific settings.
    situational:
      # How cbdino builds the cluster the situational tests drive. Every field is
      # optional; omit the whole block to use the defaults shown here.
      cbdino:
        # Couchbase Server version cbdino should deploy.
        version: "7.6"
        # Name (or path) of the cbdinocluster binary the driver invokes.
        # cbDinoClusterAppPath: cbdinocluster
        # enablePrivateEndpoint: false

      # Where the timeseries results land:
      #   hosted  the database on faas.couchbase.com (recommended — nothing to
      #           run locally). The readonly password is read from your fit-cli
      #           config (resultsDb.password in ~/.fit-cli/config.yaml — run
      #           `npm run init`); it is never stored in this file. You must be on
      #           the vpn-public VPN to reach it.
      #   local   a timescaledb database fit-cli stands up in Docker for you.
      database:
        mode: hosted

    # What to run once the performer is up.
    runtime:
      # Which FIT test-driver tests to run:
      #   all          run every situational test (the default)
      #   a YAML list  run just those fully-qualified test classes
      tests: all
      # tests:
      #   - com.couchbase.situational.tests.VolumeTest

      # Optional: Maven groups to exclude. Omit to use the standard situational
      # exclusions (openshift, capella). The situational + cbDino groups are
      # always selected.
      # excludedGroups:
      #   - openshift
      #   - capella

  # Could test other SDKs the same way here:
  # - type: situational
  #   setup:
  #     performer:
  #       sdk: python
  #   situational:
  #     database:
  #       mode: hosted
  #   runtime:
  #     tests: all
