# Preset: run all FIT functional tests and the standard QE set (situational) for a given SDK.
#
# - Functional tests run against a cbdinocluster Docker cluster on the same EC2 instance.
# - Situational (QE) tests run against a hosted Capella cluster provisioned by cbdino.
#
# Placeholders filled in by `bun run definition generate-preset`:
#   {{SDK}}              — SDK value (java, kotlin, scala, cpp, dotnet, go, node, python, ruby, rust)
#   {{PERFORMER_VERSION}} — Docker image tag for the performer (e.g. main, 4.2.0); omit the field to use the SDK default

version: 1
type: fit
instances:
  - aws: {}
    setup:
      cbdinocluster:
        init:
          # Passed to `cbdinocluster init` on clean environments to set up ~/.cbdinocluster.
          # On localhost, init is skipped and your existing ~/.cbdinocluster is used as-is.
          # Edit to taste; fit-cli appends your GitHub credentials at runtime.
          args: '--auto --aws-region us-west-2 --disable-azure --disable-gcp --disable-k8s --disable-dns --docker-network fit'
      capellaEnvironment: dev
    clusters:
      - clusterConfig: cluster-0
        sessions:
          - performer:
              sdk: '{{SDK}}'
            runs:
              - type: functional
                fitConfig: fit-config-functional
                tests:
                  presets:
                    - all
    clusterlessSessions:
      - performer:
          sdk: '{{SDK}}'
          onPortInUse: reuse
        runs:
          - type: situational
            fitConfig: fit-config-situational
            tests:
              presets:
                - standard-qe
            situational:
              database:
                mode: hosted
                resultsEnvironment: dev

clusterConfigs:
  - id: cluster-0
    cbdinocluster:
      config:
        nodes:
          - count: 3
            version: '8.0-stable'
            services:
              - kv
              - n1ql
              - index
              - fts
        docker:
          kv-memory: 4096
          fts-memory: 4096
      # Reuse an existing cbdinocluster cluster if one is already running (avoids re-creating on resume).
      onClusterExists: useExisting

fitConfigs:
  - id: fit-config-functional
    config:
      # fit-cli fills ${defaultHostname} (and rest.hostname) in at runtime once the cluster is up.
      clusterAccess:
        connectionString: 'couchbase://${defaultHostname}'
        username: Administrator
        password: password
        tls: null
        rest:
          hostname: '${defaultHostname}'
          resolveDnsSrv: false
        proxy:
          hostname: host.docker.internal
      # fit-cli will inject performerPorts at runtime.
      excludeTests:
        - situational
  - id: fit-config-situational
    config:
      # Ignored for situational-only runs — cbdino creates and manages the cluster.
      clusterAccess:
        defaultHostname: localhost
        username: Administrator
        password: password
      # fit-cli will inject performerPorts at runtime.
      excludeTests: []
      situational:
        cbdino:
          version: '7.6'
          enablePrivateEndpoint: false
