# Preset: run all FIT functional tests for a given SDK against a cbdinocluster cluster.
#
# Placeholders filled in by `bun run definition -- generate-preset`:
#   {{SDK}}              — SDK value (java, kotlin, scala, cpp, dotnet, go, node, python, ruby, rust)
#   {{PERFORMER_VERSION}} — Docker image tag for the performer (e.g. main, 4.2.0); omit the field to use the SDK default
#   {{CLUSTER_VERSION}}  — Couchbase Server version (e.g. 8.0-stable, 7.6.5)

version: 1
type: fit
instances:
  - aws: {}
    setup:
      cbdinocluster:
        init:
          # Passed to `cbdinocluster init` on clean environments to set up ~/.cbdinocluster.
          # Edit to taste; fit-cli appends your GitHub credentials at runtime.
          args: '--auto --disable-aws --disable-azure --disable-capella --disable-gcp --disable-k8s --disable-dns --docker-network fit'
    clusters:
      - clusterConfig: cluster-0
        sessions:
          - performer:
              sdk: '{{SDK}}'
            runs:
              - type: functional
                fitConfig: fit-config-0
                tests:
                  presets:
                    - all

clusterConfigs:
  - id: cluster-0
    cbdinocluster:
      config:
        nodes:
          - count: 3
            version: '{{CLUSTER_VERSION}}'
            services:
              - kv
              - n1ql
              - index
              - fts
        docker:
          kv-memory: 4096
          fts-memory: 4096
      # Reuse an existing cbdinocluster cluster if one is already running (avoids re-creating on resume).
      onClusterExists: useExisting

fitConfigs:
  - id: fit-config-0
    config:
      # fit-cli fills ${defaultHostname} (and rest.hostname) in at runtime once the cluster is up.
      clusterAccess:
        connectionString: 'couchbase://${defaultHostname}'
        username: Administrator
        password: password
        tls: null
        rest:
          hostname: '${defaultHostname}'
          resolveDnsSrv: false
        proxy:
          hostname: host.docker.internal
      # fit-cli will inject performerPorts at runtime.
      excludeTests:
        - situational
